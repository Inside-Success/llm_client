version: 2
coupling_types:
  locked:
    action: block
    description: Commit blocked until coupled doc also updated
    actor: programmatic
  generated:
    action: regenerate
    description: Regeneration command runs automatically when source changes
    actor: programmatic
  validated:
    action: agent_verify
    description: Agent checks if doc is actually stale; fixes or escalates
    actor: agent
required_reading:
  defaults:
  - AGENTS.md
couplings:
- sources:
  - llm_client/provider_limits.py
  - llm_client/cli/provider_limits.py
  - llm_client/utils/openrouter.py
  - llm_client/__main__.py
  - llm_client/__init__.py
  docs:
  - docs/adr/DECISIONS.md  # sections: 0002-routing-config-precedence, 0003-warning-taxonomy, 0010-cross-project-runtime-substrate
  - docs/plans/COMPLETED_PLANS.md  # sections: 104_openrouter-provider-limit-observer
  type: validated
  description: Provider-limit inventory, observation, authorization, and public-surface boundary.
- sources:
  - llm_client/core/client.py
  - llm_client/core/model_execution_policy.py
  - llm_client/execution/*_runtime.py
  - llm_client/execution/execution_kernel.py
  - llm_client/core/routing.py
  - llm_client/core/config.py
  docs:
  - docs/adr/DECISIONS.md  # sections: 0001-model-identity-v0, 0002-routing-config-precedence, 0003-warning-taxonomy, 0004-result-model-semantics-migration, 0009-long-thinking-background-polling, 0010-cross-project-runtime-substrate, 0014-call-replay-and-divergence-diagnosis-boundary, 0016-provider-capability-and-vendor-telemetry-boundary
  - docs/plans/COMPLETED_PLANS.md  # sections: 117_explicit_reasoning_policy
  type: validated
  description: Core call path identity, routing, warning, and execution contracts.
- sources:
  - llm_client/execution/completion_runtime.py
  - llm_client/execution/call_contracts.py
  - llm_client/utils/openrouter.py
  - llm_client/model_policy_audit.py
  - llm_client/data/default_model_registry.json
  docs:
  - docs/adr/DECISIONS.md  # sections: 0016-provider-capability-and-vendor-telemetry-boundary
  - docs/plans/COMPLETED_PLANS.md  # sections: 110_provider-capabilities-opus-ban, 117_explicit_reasoning_policy, 348_gpt54_ban_luna_default
  type: validated
  description: Generic provider controls, OpenRouter telemetry projection, and complete model-ban invariants.
- sources:
  - llm_client/agent/mcp_agent.py
  - llm_client/foundation.py
  - llm_client/sdk/agents.py
  - llm_client/tools/tool_shim.py
  docs:
  - docs/adr/DECISIONS.md  # sections: 0005-reason-code-registry-governance, 0006-actor-id-issuance-policy, 0010-cross-project-runtime-substrate
  type: validated
  description: MCP validation reason-code and Foundation actor identity governance.
- sources:
  - llm_client/io_log.py
  - llm_client/observability/*.py
  - llm_client/langfuse_callbacks.py
  - llm_client/cli/replay.py
  docs:
  - docs/adr/DECISIONS.md  # sections: 0003-warning-taxonomy, 0007-observability-contract-boundary, 0010-cross-project-runtime-substrate, 0012-shared-data-plane-boundary, 0013-stream-lifecycle-heartbeat-observability, 0014-call-replay-and-divergence-diagnosis-boundary
  type: validated
  description: Observability sink/query compatibility and warning emission surface.
- sources:
  - llm_client/prompts.py
  - llm_client/prompts/*.yaml
  docs:
  - docs/adr/DECISIONS.md  # sections: 0011-prompt-assets-explicit-identity
  type: validated
  description: Prompt asset identity, explicit rendering, and provenance constraints.
- sources:
  - workbench/frontend/**
  - workbench/backend/**
  docs:
  - ui/registry.yaml
  description: A UI-serving file is about to be created or changed. Read ui/registry.yaml
    first -- this repo has one real surface (llm-client-observability-workbench);
    a change is very unlikely to need a second one.
  why: ui-continuity-policy was prose-only (agents voluntarily reading the registry
    via the /ui skill); this makes it a real edit-time gate, matching the pattern
    piloted in cybernetic_influence_v3.
overrides: {}
